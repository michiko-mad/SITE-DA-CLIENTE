<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
      <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="imagens/shared image.jfif" class="d-block" width="500px" alt="...">
    </div>
    <div class="carousel-item">
      <img src="imagens/shared image (1).jfif" class="d-block" width="500px" alt="...">
    </div>
    <div class="carousel-item">
      <img src="imagens/shared image (3).jfif" class="d-block" width="500px" alt="...">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>

<aside class="booking-card" id="agendar">
      <h2>Agendar Atendimento</h2>
      <p>Selecione as opções abaixo para consultar a disponibilidade do estúdio.</p>
 
      <form id="bookingForm">
        <!-- Serviço -->
        <div class="form-group">
          <label for="service">Serviço Desejado</label>
          <select id="service" required>
            <option value="" disabled selected>Selecione um modelo...</option>
            <option value="Goddess Braids - R$ 350">Goddess Braids (R$ 350)</option>
            <option value="Cornrows Adulto - R$ 200">Cornrows Adulto (R$ 200)</option>
            <option value="Cornrows Infantil - R$ 150">Cornrows Infantil (R$ 150)</option>
          </select>
        </div>
 
        <!-- Data -->
        <div class="form-group">
          <label for="date">Data do Atendimento</label>
          <input type="date" id="date" required>
        </div>
 
        <!-- Horários -->
        <div class="form-group">
          <label>Horários Disponíveis</label>
          <div class="time-options">
            <button type="button" class="time-btn" onclick="selectTime(this, '09:00')">09:00</button>
            <button type="button" class="time-btn" onclick="selectTime(this, '13:00')">13:00</button>
            <button type="button" class="time-btn" onclick="selectTime(this, '16:00')">16:00</button>
          </div>
        </div>
 
        <!-- Dados do Cliente -->
        <div class="form-group">
          <label for="name">Nome Completo</label>
          <input type="text" id="name" placeholder="Digite seu nome" required>
        </div>
 
        <div class="form-group">
          <label for="phoneInput">WhatsApp para Confirmação</label>
          <input type="tel" id="phoneInput" placeholder="(00) 00000-0000" required>
        </div>
 
        <!-- Botão Final -->
        <button type="button" class="btn-submit" onclick="sendWhatsApp()">Confirmar e Enviar para WhatsApp</button>
      </form>
    </aside>


 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script> 
</body>
</html>
